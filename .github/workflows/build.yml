name: build
# Drift guard: the committed generated configs (extras/) must always match
# what the palette produces. Fails the build if someone changed the palette
# without running `make build`.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Regenerate generated configs
        run: bash scripts/build.sh
      - name: Fail if extras/ is out of date
        run: |
          if ! git diff --quiet -- extras/; then
            echo "::error::extras/ is out of date with the palette. Run 'make build' and commit."
            git --no-pager diff -- extras/
            exit 1
          fi
